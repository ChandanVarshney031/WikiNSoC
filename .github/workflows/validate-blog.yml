name: Validate Wiki MDX

on:
  push:
    branches:
      - main
    paths:
      - 'posts/**/*.mdx'
      - 'scripts/**'
  pull_request:
    paths:
      - 'posts/**/*.mdx'
      - 'scripts/**'

jobs:
  validate-posts:
    name: Validate MDX Posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Post Validator
        run: node scripts/validate-posts.js
